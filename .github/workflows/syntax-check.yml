name: Syntax check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n vmware-ova.sh
      - name: Run ShellCheck
        run: shellcheck vmware-ova.sh
      - name: Check PowerShell syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './vmware-ova.ps1'),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_ }
            exit 1
          }
      - name: Run PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module -Name PSScriptAnalyzer -Scope CurrentUser -Force
          # Write-Host is intended: the script prints an interactive menu.
          $results = Invoke-ScriptAnalyzer -Path ./vmware-ova.ps1 `
            -Severity Error, Warning `
            -ExcludeRule PSAvoidUsingWriteHost
          $results | Format-Table -AutoSize | Out-String | Write-Host
          if ($results) {
            exit 1
          }
